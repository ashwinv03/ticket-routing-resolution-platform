{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="display-6 text-primary mb-2"><i class="bi bi-robot"></i></div>
          <h4 class="fw-bold">Sign In to TicketFlow</h4>
          <p class="text-muted small">AI-Powered Ticket Routing & Resolution Platform</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username or Email</label>
            <input type="text" name="username" id="login-username" class="form-control" placeholder="admin or agent" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
        </form>

        <div class="mt-4 pt-3 border-top">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small text-muted fw-semibold">Quick Demo Login:</span>
          </div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-sm btn-outline-secondary demo-login-btn" data-user="admin" data-pass="admin123">
              Global Admin
            </button>
            <button class="btn btn-sm btn-outline-primary demo-login-btn" data-user="agent_net" data-pass="agent123">
              Team Admin (Network)
            </button>
            <button class="btn btn-sm btn-outline-secondary demo-login-btn" data-user="agent_it" data-pass="agent123">
              Support Agent (IT)
            </button>
            <button class="btn btn-sm btn-outline-secondary demo-login-btn" data-user="john_user" data-pass="user123">
              Requester
            </button>
          </div>
        </div>

        <div class="text-center mt-3">
          <span class="small text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll('.demo-login-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('login-username').value = btn.dataset.user;
      document.getElementById('login-password').value = btn.dataset.pass;
    });
  });
</script>
{% endblock %}
