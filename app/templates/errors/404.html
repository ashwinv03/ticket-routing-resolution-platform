{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <div class="display-1 text-primary fw-bold">404</div>
    <h3 class="fw-bold">Page or Ticket Not Found</h3>
    <p class="text-muted">The ticket or resource you are looking for does not exist or has been removed.</p>
    <a href="{{ url_for('tickets.list_tickets') }}" class="btn btn-primary mt-2">Back to Tickets</a>
  </div>
</div>
{% endblock %}
