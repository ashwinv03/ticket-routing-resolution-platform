{% extends "base.html" %}
{% block title %}500 Internal Server Error{% endblock %}
{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <div class="display-1 text-warning fw-bold">500</div>
    <h3 class="fw-bold">Something went wrong</h3>
    <p class="text-muted">An internal server error occurred. The transaction has been rolled back safely.</p>
    <a href="{{ url_for('tickets.list_tickets') }}" class="btn btn-primary mt-2">Return Home</a>
  </div>
</div>
{% endblock %}
